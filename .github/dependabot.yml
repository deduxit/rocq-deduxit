# Only the actions, which the workflows pin by commit. Cargo.lock and
# flake.lock move through /update-deps, which verifies before it commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The same age gate as the dependency updates: no release younger than
    # fourteen days is proposed.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
