# The package installed from its opam file as an opam user installs it,
# into a fresh switch for each Rocq the bounds admit (the last release of
# each minor version), after `opam lint': `scripts/opam-install.sh' in the
# flake's opam shell. It needs the network, which the flake's checks lack,
# so it runs here; CI and the release call it.
name: opam

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: opam install, Rocq ${{ matrix.rocq }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rocq: ["9.0.1", "9.1.1", "9.2.0", "9.3.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: deduxit
          skipPush: true
      - run: nix develop .#opam -c scripts/opam-install.sh "$ROCQ"
        env:
          ROCQ: ${{ matrix.rocq }}
          OPAM_JOBS: "4"
